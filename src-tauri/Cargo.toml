[package]
name = "save-me"
version = "0.1.0"
description = "Save Rewind (Save-me) — Automatic snapshot timeline and safe rewind tool for game saves."
edition = "2021"

[lib]
name = "save_me_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Tauri
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-global-shortcut = "2.0.0"

# Async & Serialization
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# File Watching (Invariant INV-01, INV-03)
notify = "6.1"
notify-debouncer-mini = "0.4"

# Content-Addressable Storage (CAS) & Deduplication
blake3 = "1.5"
sha2 = "0.10"
zstd = "0.13"

# Database Index & Persistence
rusqlite = { version = "0.31", features = ["bundled"] }

# System & Process Inspection (Safety Guard)
sysinfo = "0.30"
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
thiserror = "1.0"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.10"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }
