name: Bug Report
description: File a bug report for an unexpected behavior or failure in Save Rewind.
title: "[BUG]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please report any issues or unexpected behaviors so we can patch them swiftly.
  - type: textarea
    id: summary
    attributes:
      label: Bug Description
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Launch game '...'
        2. Reach save checkpoint
        3. Observe snapshot timeline
    validations:
      required: true
  - type: input
    id: game-title
    attributes:
      label: Game Title & Distribution
      placeholder: e.g. Wuchang: Fallen Feathers (Microsoft Store / PC Game Pass)
    validations:
      required: false
  - type: dropdown
    id: os-version
    attributes:
      label: Windows OS Version
      options:
        - "Windows 11 (23H2 / 24H2)"
        - "Windows 10 (22H2)"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Messages
      placeholder: Paste any console or log output here...
    validations:
      required: false
