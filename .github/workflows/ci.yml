name: CI Verification

on:
  push:
    branches: [ main, develop, 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    name: Lint, Test & Safety Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Unit Tests
        run: |
          if [ -f package.json ]; then
            npm test
          fi

      - name: Run Synthetic Save Emitter Harness
        run: |
          if [ -f scripts/synthetic_save_emitter.js ]; then
            node scripts/synthetic_save_emitter.js
          fi

      - name: Install Linux dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Run Rust Core Unit Tests
        run: |
          if [ -f src-tauri/Cargo.toml ]; then
            cargo test --manifest-path src-tauri/Cargo.toml
          fi

      - name: Validate Markdown & SDD Invariants
        run: |
          echo "Validating documentation and invariants..."
          if [ -d docs ]; then
            find docs -name "*.md" -type f -exec echo "Verified: {}" \;
          fi
